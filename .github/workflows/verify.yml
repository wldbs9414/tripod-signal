name: Verify Telegram indicators
on:
  push:
    paths:
      - 'scripts/auxiliary.py'
      - 'scripts/telegram_daily.py'
      - 'tests/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'scripts/auxiliary.py'
      - 'scripts/telegram_daily.py'
      - 'tests/**'
      - '.github/workflows/verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild from committed history (no external requests)
        run: python scripts/signal.py
      - name: Verify auxiliary calculations and Telegram messages (no sending)
        run: python -m unittest discover -s tests -v
