name: Tripod daily Telegram

on:
  schedule:
    # UTC -> Tue-Sat 08:17 KST, plus 11:17 retry. GitHub may delay jobs.
    - cron: '17 23 * * 1-5'
    - cron: '17 2 * * 2-6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test sends a connection test only; daily collects settled closes'
        type: choice
        options: [test, daily]
        default: test

# No push trigger: uploading setup code must not send an unexpected message.
permissions:
  contents: write
concurrency:
  group: tripod-daily-telegram
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Bot settings
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo '::error::Set TELEGRAM_BOT_TOKEN in Actions Secrets'; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo '::error::Set TELEGRAM_CHAT_ID in Actions Secrets'; exit 1; }
      - name: Test Telegram connection
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        run: python scripts/telegram_daily.py --test
      - name: Fetch settled closes
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'daily'
        run: python scripts/fetch.py
      - name: Rebuild upstream signals
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'daily'
        run: python scripts/signal.py --stats
      - name: Send Tripod settled signal or data-status message
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'daily'
        run: python scripts/telegram_daily.py
      - name: Report failure without a trading signal
        if: failure()
        run: python scripts/telegram_daily.py --fail
      - name: Save source data and acknowledged-send history
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.csv
          for file in data/telegram_state.json data/telegram_history.jsonl; do
            if test -f "$file"; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Record settled data and Telegram delivery state"
            git push
          fi
      - name: Keep generated signal for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tripod-signal-${{ github.run_id }}
          path: data/signal.json
          if-no-files-found: ignore
          retention-days: 30
